[package]
name = "messagenote"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "聊天框式本地优先笔记 —— 零摩擦捕获，事后组织"
# 注意：这里不要写 rust-version。
# 一旦声明了偏低的 MSRV，cargo 的 MSRV 感知解析会「向下兼容」地
# 挑到 Tauri v1 甚至预发布版本，而不是最新的稳定版。

[lib]
# Tauri v2 约定：业务逻辑放在 lib 里，main.rs 只做一层薄壳。
# 这样后续要接移动端 / 集成测试时不用改动业务代码。
name = "messagenote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# profile 定义在 workspace 根，见仓库根目录的 Cargo.toml

[dependencies]
messagenote-core = { workspace = true }
messagenote-store = { workspace = true }

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"

# 自动更新。桌面端已经分发出去了 —— 没有它，用户手上那份就是**死版本**，
# 每次发新版都得让人重新下载安装包。
#
# `updater` 负责检查/下载/校验签名。装完之后的重启**不用** tauri-plugin-process：
# 那一步要先放开单实例插件占的名字（见 `commands::relaunch`），
# 所以那条路径是自己的一个命令。
tauri-plugin-updater = "2"

# 导出时选目标目录。Tauri v2 没有内置的文件对话框，标准做法就是这个插件。
# 权限只给主窗口（见 capabilities/dialog.json）—— 捕获浮层是个只有一个输入框的
# 小窗，它没有任何理由需要"挑一个目录"的能力。
tauri-plugin-dialog = "2"

# 只跑一个实例。没有它，重复点图标（或开机自启 + 手动再点一次）会开出第二个
# 进程：两个进程抢同一个 SQLite 文件、各挂一个托盘图标，而用户看到的是
# "点了没反应"。见 lib.rs 里的装配与逃生口说明。
tauri-plugin-single-instance = "2"

# 单条复制时把图片内联成 data URI。手写 base64 是纯风险（漏了填充、算错 6 位组
# 都不会报错，只会得到一张画不出来的图），而它本来就在依赖树里（0.22.1）。
base64 = "0.22"

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
ureq = { version = "3.4.2", features = ["json"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# 端到端测试会在一份进程里把**真实的** axum 服务端跑起来，
# 让两个真实的客户端库通过真实 HTTP 同步。
messagenote-server = { path = "../crates/server" }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
