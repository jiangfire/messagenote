# 一条命令起一个完整的 MessageNote：`docker compose up -d`
#
# 两个容器：服务端（管数据和同步）+ 网页端（托管界面并反代 API）。
# 对外只暴露一个端口 —— **同源是刻意的**，服务端不带任何 CORS 头。
#
# 用法：
#   cp deploy/.env.example deploy/.env    # 填一个至少 32 字符的令牌
#   docker compose --env-file deploy/.env up -d
#
# 然后把桌面端的「设置 → 同步」指向 http://<这台机器>:8080，用同一个令牌。
# 浏览器直接打开同一个地址就是网页端。

services:
  server:
    image: ghcr.io/jiangfire/messagenote-server:latest
    # 想自己构建就把上面那行注释掉、打开下面这行：
    # build:
    #   context: .
    #   dockerfile: deploy/server.Dockerfile
    environment:
      # 唯一的凭据。**必须给**，服务端启动时会强制检查长度（至少 32 字符）。
      # 用 `openssl rand -base64 48` 生成一个。
      MESSAGENOTE_TOKEN: ${MESSAGENOTE_TOKEN:?请先设置 MESSAGENOTE_TOKEN（至少 32 字符）}
      MESSAGENOTE_BIND: 0.0.0.0:8787
      MESSAGENOTE_DB: /data/messagenote.sqlite
    volumes:
      # 全部状态都在这个卷里的一个 .sqlite 文件里（附件字节也在里面）。
      # 备份 = 备份这个卷；用 Litestream 的话直接跟这个文件。
      - messagenote-data:/data
    restart: unless-stopped
    # 不对外暴露端口：只有 web 容器需要能连到它。
    # 想在局域网里直连 API 调试的话，把下面两行打开。
    # ports:
    #   - "8787:8787"

  web:
    image: ghcr.io/jiangfire/messagenote-web:latest
    # build:
    #   context: .
    #   dockerfile: deploy/web.Dockerfile
    environment:
      # 反代到服务端容器。compose 的网络里服务名就是主机名。
      MESSAGENOTE_API: server:8787
    ports:
      - "${MESSAGENOTE_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  messagenote-data:
